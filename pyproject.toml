[project]
name = "ticksense"
version = "0.1.0"
description = "Real-time crypto market lakehouse"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["ingest", "api", "replay"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.11.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "testcontainers[kafka,postgres]>=4.8",
    "httpx>=0.27",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["N818", "B008"]  # B008: FastAPI Depends() in defaults is intentional

[tool.ruff.lint.per-file-ignores]
"flink/**" = ["UP017"]  # datetime.UTC requires Python 3.11+; flink container runs 3.10

[tool.ruff.lint.isort]
known-first-party = ["ingest", "api", "replay"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["ingest/tests", "api/tests", "replay/tests", "flink/tests", "airflow/tests", "spark/tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["ingest/src", "api/src", "replay/src", "flink/jobs/lib"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
