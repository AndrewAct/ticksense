[project]
name = "ticksense"
version = "0.1.0"
description = "Real-time crypto market lakehouse"
requires-python = ">=3.12"

[tool.uv.workspace]
members = ["ingest", "api", "replay"]

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "mypy>=1.11.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "testcontainers[redpanda,postgres]>=4.8",
    "httpx>=0.27",
    "pydantic-mypy>=2.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["ingest", "api", "replay"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["ingest/tests", "api/tests", "replay/tests"]
addopts = "--tb=short"

[tool.coverage.run]
source = ["ingest/src", "api/src", "replay/src"]
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
