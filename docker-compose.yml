services:

  # ── Redpanda (Kafka-compatible broker) ──────────────────────────────────────

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --default-log-level=warn
    ports:
      - "19092:19092"
      - "18082:18082"
      - "18081:18081"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -qE 'Healthy:.+true'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    environment:
      CONFIG_FILEPATH: /etc/console/config.yaml
    volumes:
      - ./infra/config/redpanda/console.yaml:/etc/console/config.yaml:ro
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        rpk topic create market.raw.orderbook          --brokers redpanda:9092 --partitions 10 --replicas 1 || true
        rpk topic create market.normalized.book_ticker --brokers redpanda:9092 --partitions 10 --replicas 1 || true
        rpk topic create market.agg.ohlcv_1m           --brokers redpanda:9092 --partitions 4  --replicas 1 || true
        rpk topic create market.dlq                    --brokers redpanda:9092 --partitions 2  --replicas 1 || true
        rpk topic create postgres.public.symbol_config --brokers redpanda:9092 --partitions 1  --replicas 1 || true
    restart: "no"

  # ── Postgres ─────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ticksense
      POSTGRES_USER: ticksense
      POSTGRES_PASSWORD: changeme
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=5
        -c max_wal_senders=5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticksense -d ticksense"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── Postgres init (schema + seed data) ───────────────────────────────────────

  postgres-init:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: changeme
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "=== Initializing symbol_config table ===" && \
        psql -h postgres -U ticksense -d ticksense \
             -f /docker-entrypoint-initdb.d/init.sql && \
        echo "=== Postgres init complete ==="
    volumes:
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: "no"

  # ── MinIO (S3-compatible object store) ───────────────────────────────────────

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-25Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/ticksense
        mc anonymous set none local/ticksense
    restart: "no"

  # ── Iceberg REST catalog ──────────────────────────────────────────────────────

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://ticksense/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8181'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ── Trino ────────────────────────────────────────────────────────────────────

  trino:
    image: trinodb/trino:457
    depends_on:
      iceberg-rest:
        condition: service_healthy
    volumes:
      - ./infra/config/trino:/etc/trino:ro
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 40s
    restart: unless-stopped

  # ── Flink ────────────────────────────────────────────────────────────────────

  flink-jobmanager:
    build: ./flink
    command: jobmanager
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend: filesystem
        state.checkpoints.dir: s3://ticksense/flink-checkpoints
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        python.executable: python3
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8081:8081"
    volumes:
      - flink-data:/tmp/flink
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  flink-taskmanager:
    build: ./flink
    command: taskmanager
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend: filesystem
        state.checkpoints.dir: s3://ticksense/flink-checkpoints
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        python.executable: python3
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    volumes:
      - flink-data:/tmp/flink
    restart: unless-stopped

  flink-init:
    build: ./flink
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
      debezium-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ICEBERG_REST_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: s3://ticksense/warehouse
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      PYTHONPATH: /opt/flink/jobs
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "=== Submitting normalize job ===" && \
        /opt/flink/bin/flink run --detached \
          --jobmanager flink-jobmanager:8081 \
          --python /opt/flink/jobs/normalize.py && \
        echo "=== Submitting ohlcv_1m job ===" && \
        /opt/flink/bin/flink run --detached \
          --jobmanager flink-jobmanager:8081 \
          --python /opt/flink/jobs/ohlcv_1m.py && \
        echo "=== Submitting cdc_symbol_config job ===" && \
        /opt/flink/bin/flink run --detached \
          --jobmanager flink-jobmanager:8081 \
          --python /opt/flink/jobs/cdc_symbol_config.py && \
        echo "=== All Flink jobs submitted ==="
    restart: "no"

  # ── Debezium (Postgres CDC → Kafka) ──────────────────────────────────────────
  #
  # Debezium reads Postgres WAL via logical replication (pgoutput plugin, built-in
  # since Postgres 10).  Each committed INSERT/UPDATE/DELETE on symbol_config is
  # emitted as a CDC event to kafka topic: postgres.public.symbol_config
  #
  # Envelope format (schemas.enable=false):
  #   { "before": {…|null}, "after": {…|null},
  #     "source": {"lsn": int, "ts_ms": long, "txId": int, …},
  #     "op": "r"|"c"|"u"|"d", "ts_ms": long }
  #
  # op codes:  r=snapshot read, c=create, u=update, d=delete
  # tombstones.on.delete=false — null-value tombstone messages are suppressed;
  #   the preceding d event already captures the pre-delete row state.

  debezium:
    image: debezium/connect:2.6
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: debezium-connect-group
      CONFIG_STORAGE_TOPIC: debezium.configs
      OFFSET_STORAGE_TOPIC: debezium.offsets
      STATUS_STORAGE_TOPIC: debezium.status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  debezium-init:
    image: curlimages/curl:8.11.1
    depends_on:
      debezium:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "=== Registering Debezium connector (idempotent) ===" && \
        if curl -sf http://debezium:8083/connectors/ticksense-symbol-config > /dev/null 2>&1; then
          echo "Connector already exists, skipping registration"
        else
          curl -sf -X POST http://debezium:8083/connectors \
            -H "Content-Type: application/json" \
            -d @/config/connector.json && \
          echo ""
        fi && \
        echo "=== Connector status ===" && \
        sleep 3 && \
        curl -sf http://debezium:8083/connectors/ticksense-symbol-config/status
    volumes:
      - ./infra/config/debezium/connector.json:/config/connector.json:ro
    restart: "no"

  # ── Ingest service ───────────────────────────────────────────────────────────

  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      BINANCE_WS_BASE_URL: wss://stream.binance.us:9443/ws
      BINANCE_REST_BASE_URL: https://api.binance.us
      INGEST_SYMBOLS: '["btcusdt","ethusdt","solusdt","bnbusdt","xrpusdt"]'
      LOG_LEVEL: INFO
      ENV: docker
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ── dbt runner (one-shot: creates staging views + mart tables in Trino) ──────

  dbt-runner:
    build: ./dbt
    working_dir: /dbt
    volumes:
      - ./dbt:/dbt
    environment:
      TRINO_HOST: trino
      TRINO_PORT: "8080"
    command:
      - bash
      - -c
      - |
        echo "=== Waiting for Flink to create normalized schema ===" && \
        until python3 -c "
        import trino, sys
        try:
            conn = trino.dbapi.connect(host='trino', port=8080, user='dbt', catalog='iceberg')
            cur = conn.cursor()
            cur.execute('SELECT 1 FROM iceberg.normalized.book_ticker LIMIT 1')
            cur.fetchall()
            sys.exit(0)
        except Exception as e:
            print(f'Not ready: {e}')
            sys.exit(1)
        " 2>/dev/null; do
          echo "  normalized.book_ticker not ready, retrying in 10s..."
          sleep 10
        done && \
        echo "=== normalized schema ready, running dbt ===" && \
        dbt run --profiles-dir . --no-send-anonymous-usage-stats && \
        echo "=== dbt run complete ==="
    depends_on:
      trino:
        condition: service_healthy
      flink-init:
        condition: service_completed_successfully
    restart: "no"

  # ── FastAPI query layer ───────────────────────────────────────────────────────

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      trino:
        condition: service_healthy
      dbt-runner:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # ── Prometheus ───────────────────────────────────────────────────────────────

  prometheus:
    image: victoriametrics/victoria-metrics:v1.102.1
    volumes:
      - ./infra/config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/victoria-metrics-data
    command:
      - "--promscrape.config=/etc/prometheus/prometheus.yml"
      - "--promscrape.config.strictParse=false"
      - "--retentionPeriod=7d"
      - "--httpListenAddr=:9090"
    ports:
      - "9090:9090"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── Grafana ──────────────────────────────────────────────────────────────────

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/ticksense.json
    volumes:
      - ./infra/config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/config/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ── k6 load generator (not started by make up — use make load-gen) ──────────

  k6:
    image: grafana/k6:latest
    profiles:
      - load-test
    volumes:
      - ./k6:/scripts:ro
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_STATS: p(50),p(95),p(99),max
    command: run --out experimental-prometheus-rw /scripts/script.js
    depends_on:
      api:
        condition: service_healthy
      prometheus:
        condition: service_healthy
    restart: "no"

volumes:
  redpanda-data:
  postgres-data:
  minio-data:
  flink-data:
  prometheus-data:
  grafana-data:
