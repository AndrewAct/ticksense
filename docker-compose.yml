services:

  # ── Redpanda (Kafka-compatible broker) ──────────────────────────────────────

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --pandaproxy-addr=internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr=internal://redpanda:8082,external://localhost:18082
      - --schema-registry-addr=internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr=redpanda:33145
      - --advertise-rpc-addr=redpanda:33145
      - --mode=dev-container
      - --default-log-level=warn
    ports:
      - "19092:19092"
      - "18082:18082"
      - "18081:18081"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -qE 'Healthy:.+true'"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    environment:
      CONFIG_FILEPATH: /etc/console/config.yaml
    volumes:
      - ./infra/config/redpanda/console.yaml:/etc/console/config.yaml:ro
    ports:
      - "8080:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  redpanda-init:
    image: docker.redpanda.com/redpandadata/redpanda:v24.3.1
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        rpk topic create market.raw.orderbook         --brokers redpanda:9092 --partitions 10 --replicas 1 || true
        rpk topic create market.normalized.book_ticker --brokers redpanda:9092 --partitions 10 --replicas 1 || true
        rpk topic create market.dlq                   --brokers redpanda:9092 --partitions 2  --replicas 1 || true
    restart: "no"

  # ── Postgres ─────────────────────────────────────────────────────────────────

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ticksense
      POSTGRES_USER: ticksense
      POSTGRES_PASSWORD: changeme
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=5
        -c max_wal_senders=5
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticksense -d ticksense"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # ── MinIO (S3-compatible object store) ───────────────────────────────────────

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2024-11-17T19-35-25Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 minioadmin minioadmin
        mc mb --ignore-existing local/ticksense
        mc anonymous set none local/ticksense
    restart: "no"

  # ── Iceberg REST catalog ──────────────────────────────────────────────────────

  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    depends_on:
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://ticksense/warehouse
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: "true"
    ports:
      - "8181:8181"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/8181'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  # ── Trino ────────────────────────────────────────────────────────────────────

  trino:
    image: trinodb/trino:457
    depends_on:
      iceberg-rest:
        condition: service_healthy
    volumes:
      - ./infra/config/trino:/etc/trino:ro
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 40s
    restart: unless-stopped

  # ── Flink ────────────────────────────────────────────────────────────────────

  flink-jobmanager:
    build: ./flink
    command: jobmanager
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend: filesystem
        state.checkpoints.dir: s3://ticksense/flink-checkpoints
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        python.executable: python3
    depends_on:
      minio:
        condition: service_healthy
    ports:
      - "8081:8081"
    volumes:
      - flink-data:/tmp/flink
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/overview"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

  flink-taskmanager:
    build: ./flink
    command: taskmanager
    environment:
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        state.backend: filesystem
        state.checkpoints.dir: s3://ticksense/flink-checkpoints
        s3.access-key: minioadmin
        s3.secret-key: minioadmin
        s3.endpoint: http://minio:9000
        s3.path.style.access: true
        python.executable: python3
    depends_on:
      flink-jobmanager:
        condition: service_healthy
    volumes:
      - flink-data:/tmp/flink
    restart: unless-stopped

  flink-init:
    build: ./flink
    depends_on:
      flink-jobmanager:
        condition: service_healthy
      iceberg-rest:
        condition: service_healthy
      redpanda-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      ICEBERG_REST_URI: http://iceberg-rest:8181
      ICEBERG_WAREHOUSE: s3://ticksense/warehouse
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
      PYTHONPATH: /opt/flink/jobs
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        echo "=== Submitting normalize job ===" && \
        /opt/flink/bin/flink run --detached \
          --jobmanager flink-jobmanager:8081 \
          --python /opt/flink/jobs/normalize.py && \
        echo "=== Submitting ohlcv_1m job ===" && \
        /opt/flink/bin/flink run --detached \
          --jobmanager flink-jobmanager:8081 \
          --python /opt/flink/jobs/ohlcv_1m.py && \
        echo "=== All Flink jobs submitted ==="
    restart: "no"

  # ── Ingest service ───────────────────────────────────────────────────────────

  ingest:
    build:
      context: .
      dockerfile: ingest/Dockerfile
    environment:
      KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
      KAFKA_SECURITY_PROTOCOL: PLAINTEXT
      BINANCE_WS_BASE_URL: wss://stream.binance.us:9443/ws
      BINANCE_REST_BASE_URL: https://api.binance.us
      INGEST_SYMBOLS: '["btcusdt","ethusdt","solusdt","bnbusdt","xrpusdt"]'
      LOG_LEVEL: INFO
      ENV: docker
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  redpanda-data:
  postgres-data:
  minio-data:
  flink-data:
