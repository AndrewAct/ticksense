[project]
name = "ticksense-ingest"
version = "0.1.0"
description = "Binance L2 WebSocket ingestion into Kafka"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.12"
dependencies = [
    "websockets>=13.0",
    "aiokafka>=0.11.0",
    "httpx>=0.27",
    "certifi>=2024.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.2",
]

[project.scripts]
ticksense-ingest = "ingest.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingest"]
