version: 2

models:
  - name: int_spread_metrics
    description: "Latest best bid/ask spread metrics per (exchange, symbol). Ephemeral."
    columns:
      - name: exchange
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: latest_ts
        tests: [not_null]
      - name: spread
        tests: [not_null]
      - name: spread_bps
        tests: [not_null]

  - name: int_order_book_imbalance
    description: "Latest order book imbalance per (exchange, symbol). Ephemeral."
    columns:
      - name: exchange
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: imbalance
        tests: [not_null]
      - name: market_signal
        tests:
          - not_null
          - accepted_values:
              values: ['BUY_PRESSURE', 'SELL_PRESSURE', 'NEUTRAL']

  - name: int_freshness_status
    description: "Per-symbol data freshness relative to current_timestamp. Ephemeral."
    columns:
      - name: exchange
        tests: [not_null]
      - name: symbol
        tests: [not_null]
      - name: staleness_seconds
        tests: [not_null]
      - name: freshness_status
        tests:
          - not_null
          - accepted_values:
              values: ['FRESH', 'WARN', 'STALE']
